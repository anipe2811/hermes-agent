services:
  hermes:
    build: .
    container_name: hermes-agent
    restart: unless-stopped
    # Bind to localhost only — public access goes through the host nginx reverse proxy.
    # (This VPS uses nginx, not Traefik, so no Traefik labels are needed.)
    ports:
      - "127.0.0.1:8700:8000"
    env_file:
      - .env
